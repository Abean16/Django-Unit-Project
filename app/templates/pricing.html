{% extends 'base.html' %}
{% load static %}
{% block content %}
<div class="price-page">
    <div class="price-content">
        <a class="back-button" href="{% url 'storefront' %}">Return to Store Front</a>
        <h1>{{ item.name }}</h1>
        <p>${{ item.price }} Each</p>
        <p>{{ item.description }}</p>
        <img src="{{ item.image.url }}" alt="{{ item.name }}" style="width: 200px; height: 200px;">

        <form action="{% url 'pricing' item.id %}" method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="button">Submit</button>
        </form>

        {% if quantity %}
            <p>Selected quantity: {{ quantity }}</p>
            <a href="{% url 'checkout' item.id quantity %}">
                <button>Proceed to Checkout</button>
            </a>
        {% endif %}
    </div>
</div>
{% endblock content %}
